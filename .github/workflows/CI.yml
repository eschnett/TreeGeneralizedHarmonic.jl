name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.threads || 1 }} thread(s)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # **TEMPORARY (2026-09-19): `1.11` is dropped and coverage is off.**
        # Both must come back; `CODE.md`, "What the suite costs, and
        # where", has the measurements and this comment is the checklist.
        #
        #   * `version: ["1.11", "1"]` -- 1.11 is the floor, because
        #     neither TreeAMR nor SpacetimeMetrics is registered and
        #     `Project.toml` locates both through `[sources]` entries,
        #     which 1.11 introduced. It is dropped only because
        #     `pointwise_tests.jl:480` reports 176 bytes there where it
        #     claims zero -- 8 failures, identical on both architectures,
        #     uninstrumented, and *not* reproducible in isolation. Nothing
        #     else about 1.11 fails, so the floor is untested rather than
        #     broken, and a `[compat]` floor nothing exercises is exactly
        #     what `prerequisite_tests.jl` exists to notice.
        #   * coverage -- see the `julia-runtest` step below.
        version: ["1"]
        os: [ubuntu-latest, macOS-latest]
        # `threads` is a matrix key with one value rather than something
        # the `include:` below adds, and that is load-bearing. An include
        # entry that only *adds* keys merges into every combination it
        # matches, so spelling the threaded cell as `{version: "1", os:
        # ubuntu-latest, threads: 4}` against a two-key matrix silently
        # turned the serial Linux cell into the threaded one instead of
        # adding a fifth job -- which is why the four exact-equality
        # failures of 2026-09-18 could not be attributed to the thread
        # count or to the compiler. An include that *overwrites* a matrix
        # key adds a combination, which is what this spelling buys.
        threads: [1]
        include:
          - version: "1"
            os: ubuntu-latest
            threads: 4
          # **TEMPORARY**: the coverage cell was spelled here, as
          #     - version: "1"
          #       os: ubuntu-latest
          #       threads: 1
          #       coverage: true
          # It overwrites no matrix key, so it merges into the serial Linux
          # cell rather than adding a job -- the opposite of the entry
          # above, and wanted. Restore it with the steps below.
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      # **TEMPORARY**: `julia-runtest` instruments every cell by default,
      # and the `with: coverage: ...` clause that gated it to one cell is
      # removed along with the `julia-processcoverage` and
      # `codecov/codecov-action` steps that followed this one. Restore all
      # three together; the gate was
      #     coverage: ${{ matrix.coverage == true && (github.ref ==
      #                  'refs/heads/main' || github.event_name ==
      #                  'workflow_dispatch') }}
      # and the upload was `files: lcov.info`, `token:
      # ${{ secrets.CODECOV_TOKEN }}` (already set), `fail_ci_if_error:
      # false`.
      #
      # It is off because instrumented runs **compute wrong numbers on
      # GitHub's runners**: 115 failed and 12 errored on 2026-09-19, with
      # `sqrt` of negative order-one arguments, NaNs and errors of `1e-5`
      # -- not tolerances. It is the runner and not the instrumentation:
      # the identical instrumented suite passes 3444/3444 on Symmetry.
      # Until that is understood, the README's Codecov badge goes stale.
      - uses: julia-actions/julia-runtest@v1
        env:
          # The suite must pass, with identical numbers, threaded as well
          # as serial. One entry of the matrix is enough to guard that:
          # the thread-independence test spawns a subprocess at the
          # *other* count either way, so between this job and the serial
          # ones both directions are covered. (That test arrives in step
          # 4; the entry is here from the start so that the threaded path
          # is exercised while it is being written.)
          JULIA_NUM_THREADS: ${{ matrix.threads || 1 }}

  # There is deliberately no viewer job and no figure job yet. TreeWave has
  # both because `bin/` is a second environment with its own copies of the
  # unregistered dependencies, which the test job cannot exercise -- during
  # its development that let `bin/` keep building against an older TreeAMR
  # than the tests. This package has no `bin/` until step 9, and the jobs
  # are added with it. See "I/O and viewers" in `CODE.md`.
