name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.threads || 1 }} thread(s)
    runs-on: ${{ matrix.os }}
    env:
      # Pkg clones through libgit2, whose ssh-agent support is unreliable
      # across platforms: it does not find the agent below and reports the
      # failure as `GitError(Code:EUSER, ..., user cancelled credential
      # request)`, which names neither ssh nor the repository. This makes
      # Pkg shell out to the `git` binary instead, which uses the agent the
      # way every other tool does. It is set on the *job* rather than on
      # `julia-buildpkg`, because `Pkg.test` resolves the test environment
      # a second time and so clones a second time.
      JULIA_PKG_USE_CLI_GIT: true
    strategy:
      fail-fast: false
      matrix:
        # Julia 1.11 is the floor: neither TreeAMR nor SpacetimeMetrics is
        # registered, so Project.toml locates both through `[sources]`
        # entries, which 1.11 introduced.
        version: ["1.11", "1"]
        os: [ubuntu-latest, macOS-latest]
        # `threads` is a matrix key with one value rather than something
        # the `include:` below adds, and that is load-bearing. An include
        # entry that only *adds* keys merges into every combination it
        # matches, so spelling the threaded cell as `{version: "1", os:
        # ubuntu-latest, threads: 4}` against a two-key matrix silently
        # turned the serial Linux cell into the threaded one instead of
        # adding a fifth job -- which is why the four exact-equality
        # failures of 2026-09-18 could not be attributed to the thread
        # count or to the compiler. An include that *overwrites* a matrix
        # key adds a combination, which is what this spelling buys.
        threads: [1]
        include:
          - version: "1"
            os: ubuntu-latest
            threads: 4
          # Coverage rides exactly one cell, marked here rather than
          # spelled as a condition on the steps below, so that moving it is
          # a one-line change. This entry overwrites no matrix key, so it
          # merges into the serial Linux cell on the current release rather
          # than adding a fifth -- which is the behaviour the entry above
          # has to work around, and is wanted here.
          - version: "1"
            os: ubuntu-latest
            threads: 1
            coverage: true
    steps:
      - uses: actions/checkout@v7
      # `KorzynskiSpin` is a private repository, so its `[sources]` entry is
      # an ssh URL and an anonymous runner cannot clone it. The secret is
      # the private half of a read-only deploy key on
      # `eschnett/KorzynskiSpin.jl`; the key is scoped to that one
      # repository and grants nothing else, which a personal access token
      # would not manage. The other three dependencies are public and clone
      # over https as before, untouched by this.
      #
      # This whole step goes away, along with the env var above, the day
      # `KorzynskiSpin.jl` is made public and its `[sources]` entry becomes
      # the https URL of the other three. See `CODE.md`.
      #
      # Note that secrets are not available to `pull_request` runs from
      # forks, so a pull request from outside this account cannot pass
      # until then.
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.KORZYNSKI_DEPLOY_KEY }}
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # `julia-runtest` instruments every cell by default, and this
          # suite is long enough that that is most of an hour of runner
          # time bought for nothing: the cells run the same lines, so only
          # the one the badge reads needs to report them. Gating to `main`
          # and to a manual dispatch keeps pull requests to the tests
          # alone, and keeps the upload path exercisable from a branch.
          #
          # Coverage is *not* what makes the 1.11 allocation claims fail,
          # which was the first guess once it turned out every cell was
          # instrumented -- measured here, `@allocated` of both weight
          # functions is 0 at 1.11.9 under `--code-coverage=user`, with
          # instrumentation demonstrably reaching TreeGH, StaticArrays and
          # TreeAMR. See "Measured results" in `CODE.md`.
          coverage: ${{ matrix.coverage == true && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
        env:
          # The suite must pass, with identical numbers, threaded as well
          # as serial. One entry of the matrix is enough to guard that:
          # the thread-independence test spawns a subprocess at the
          # *other* count either way, so between this job and the serial
          # ones both directions are covered. (That test arrives in step
          # 4; the entry is here from the start so that the threaded path
          # is exercised while it is being written.)
          JULIA_NUM_THREADS: ${{ matrix.threads || 1 }}
      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ matrix.coverage == true && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
      - uses: codecov/codecov-action@v5
        if: ${{ matrix.coverage == true && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Codecov outage should not turn a green test run red.
          fail_ci_if_error: false

  # There is deliberately no viewer job and no figure job yet. TreeWave has
  # both because `bin/` is a second environment with its own copies of the
  # unregistered dependencies, which the test job cannot exercise -- during
  # its development that let `bin/` keep building against an older TreeAMR
  # than the tests. This package has no `bin/` until step 9, and the jobs
  # are added with it. See "I/O and viewers" in `CODE.md`.
