name: CI

# Two tiers, the same in every Tree* repository. A pull request runs the
# Linux cells only, uninstrumented: the full suite has already run on the
# author's machine (macOS, arm64), so what CI adds there is x86-64 Linux,
# a clean environment and bounds checks. A push to `main`, the weekly
# schedule and a manual dispatch run the whole matrix, macOS and coverage
# included. Markdown-only changes run nothing, since no test reads them.
# Tags are not tested: a release tags a commit that has passed on `main`.
#
# Every cell runs the *quick tier* of the suite (`TREEGH_TEST_TIER=quick`,
# 2026-11-06): everything but the testsets that evolve a black hole, which
# `test/tiers.jl` marks. Evolving a hole is workstation and Symmetry work --
# the serial cell took 72 minutes here, 46 of them in those testsets -- and
# the full suite runs there, before a pull request, reported on the commit as
# a `full-suite/<host>` status by `ci/full-suite.sh`. The weekly schedule
# runs the full tier here too, off anyone's critical path, and a manual
# dispatch takes the tier as an input. The MPI comparison is a job of its own.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  # Weekly, for what changes without a push here: the registry, and the
  # dependencies taken from `main` through `[sources]`. The Tree*
  # repositories are staggered by 20 minutes so that their macOS cells do
  # not queue behind each other (five run at once per account).
  schedule:
    - cron: "40 5 * * 1"
  workflow_dispatch:
    inputs:
      tier:
        description: "The test tier: quick, or full (the hole evolutions too)"
        type: choice
        options: [quick, full]
        default: quick

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `quick` unless the weekly schedule or a dispatch asks for `full`.
  TREEGH_TEST_TIER: ${{ github.event.inputs.tier || (github.event_name == 'schedule' && 'full') || 'quick' }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.threads }} thread(s)
    runs-on: ${{ matrix.os }}
    # The quick tier is about half an hour on the serial cell; the full tier
    # was 72 minutes on Linux and is given room for the instrumented macOS
    # cell.
    timeout-minutes: ${{ (github.event.inputs.tier == 'full' || github.event_name == 'schedule') && 180 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        # Julia 1.13 is the floor (`julia = "1.13"` in `Project.toml`) and
        # the only version tested: supporting earlier versions slows
        # development and is not useful at the moment (Erik, 2026-10-16).
        # `setup-julia` resolves "1.13" to its latest patch release.
        version: ["1.13"]
        # macOS only off pull requests (see `on:` above).
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macOS-latest"]') }}
        # `threads` is a matrix key with one value rather than something
        # the `include:` below adds, and that is load-bearing. An include
        # entry that only *adds* keys merges into every combination it
        # matches, so spelling the threaded cell as `{version: "1.13", os:
        # ubuntu-latest, threads: 4}` against a two-key matrix silently
        # turned the serial Linux cell into the threaded one instead of
        # adding a fifth job -- which is why the four exact-equality
        # failures of 2026-09-18 could not be attributed to the thread
        # count or to the compiler. An include that *overwrites* a matrix
        # key adds a combination, which is what this spelling buys.
        threads: [1]
        include:
          - version: "1.13"
            os: ubuntu-latest
            threads: 4
    # Coverage rides exactly one cell, the serial macOS one, and only off
    # pull requests. It is a condition here, once, and not a `coverage`
    # key in the matrix: on a pull request the matrix has no macOS cell,
    # and an include entry that matches no combination adds one. macOS
    # and not Linux (2026-09-26): instrumented runs compute wrong numbers
    # on GitHub's Linux runners (see the `julia-runtest` step), and the
    # instrumented macOS cell passes.
    env:
      COVERAGE: ${{ matrix.os == 'macOS-latest' && matrix.threads == 1 && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # `julia-runtest` instruments every cell by default, and this
          # suite is long enough that that is most of an hour of runner
          # time bought for nothing: the cells run the same lines, so only
          # the one the badge reads needs to report them. Gating it off
          # pull requests (to `main`, the weekly run and a manual dispatch)
          # keeps pull requests to the tests alone, and keeps the upload
          # path exercisable from a branch.
          #
          # **Not a Linux cell.** Instrumented runs compute wrong numbers
          # on GitHub's Linux runners: 115 failed and 12 errored on
          # 2026-09-19, and 207 failed and 26 errored on 2026-09-26 (Julia
          # 1.13.1, the threaded cell, which the removal of this gate had
          # left instrumented) -- `sqrt` of negative order-one arguments,
          # NaNs and errors of `1e-5`, not tolerances -- while the same
          # instrumented suite passes on macOS here and 3444/3444 on
          # Symmetry. Probes of 146 runners (2026-09-26/27) tied it down:
          # it takes `--code-coverage` *and* `--check-bounds=yes` together
          # (which is what `julia-runtest` passes; either alone is fine), on
          # AMD Zen 4/Zen 5 (`znver4`/`znver5`) *with AVX-512 exposed* --
          # EPYC 9V45 always, EPYC 9V74 exactly on the VMs that expose
          # AVX-512 -- and on Julia 1.13.0 and 1.13.1: the same 139
          # pointwise claims fail every time. Not on Zen 3, Zen 4 without
          # AVX-512 or Intel with it, and fixed in nightly
          # (1.14.0-DEV.3386: 8 of 8 Zen 4/5 jobs pass). A deterministic
          # miscompilation, not a faulty machine. Coverage is measured
          # where it computes the right answer.
          coverage: ${{ env.COVERAGE }}
        env:
          # The suite must pass, with identical numbers, threaded as well
          # as serial. One entry of the matrix is enough to guard that:
          # the thread-independence test spawns a subprocess at the
          # *other* count either way, so between this job and the serial
          # ones both directions are covered. (That test arrives in step
          # 4; the entry is here from the start so that the threaded path
          # is exercised while it is being written.)
          JULIA_NUM_THREADS: ${{ matrix.threads }}
          # The MPI comparison is the `mpi` job below (2026-11-06). Until then
          # it ran inside the threaded Linux cell, first, for 17.5 of that
          # cell's 71 minutes.
          TREEGH_TEST_MPI: "0"
      - uses: julia-actions/julia-processcoverage@v1
        if: env.COVERAGE == 'true'
      - uses: codecov/codecov-action@v7
        if: env.COVERAGE == 'true'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Codecov outage should not turn a green test run red.
          fail_ci_if_error: false

  # The MPI comparison (added 2026-10-19; a job of its own from 2026-11-06):
  # `mpiexec -n 3` of `test/mpi_workload.jl` against its serial run, three
  # ranks of about 3 GB each. It was in the threaded Linux cell until then,
  # run before the suite because beside it the 16 GB runner went down in five
  # of thirteen attempts; on a runner of its own it is neither beside nor
  # before anything, and the cells do not wait for it. `TREEGH_TEST_TIER=mpi`
  # runs `test/mpi_tests.jl` alone, and `TREEGH_TEST_MPI=1` forces the job on
  # a machine with less than the 24 GB `test/mpi_jobs.jl` asks for.
  mpi:
    name: Julia 1.13 - ubuntu-latest - MPI, 3 ranks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13"
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false
        env:
          TREEGH_TEST_TIER: mpi
          TREEGH_TEST_MPI: "1"

  # There is deliberately no viewer job and no figure job yet. TreeWave has
  # both because `bin/` is a second environment with its own copies of the
  # unregistered dependencies, which the test job cannot exercise -- during
  # its development that let `bin/` keep building against an older TreeAMR
  # than the tests. This package has no `bin/` until step 9, and the jobs
  # are added with it. See "I/O and viewers" in `CODE.md`.
