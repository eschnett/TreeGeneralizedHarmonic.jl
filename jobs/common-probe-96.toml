# Step B7's probe of the common horizon on step H4's 1/96 roll-on rows, one after
# the other on one node (`jobs/common-probe.toml` has the 1/48 rows and says
# why). Each row is
# continued from its 28 M checkpoint to the plunge (the tracks are lost at about
# 30.25 M, which ends the run with a TrackLostError), with `common_probe=28`. Beside
# each pair of individual finds, `bench/common_find_probe.jl` attempts a common
# horizon and prints what the finder did and what it cost (`common:` and `indiv:`
# lines in the log). The attempts change nothing the run carries.
#
# The rows' commands are `jobs/h4-pair.toml`'s, plus the option. The start is not
# in this spec: copy the row's 28 M checkpoint (and nothing newer) from
# `/scratch/eschnett/claude/xcts-s1/h4r96{s5/s5,s10/s10}/ck/` into the run's
# `<scratch>/<study>/common-probe-96-<label>/mutable/ck/` before the first job. Copy,
# do not link: the run rotates the files in its `ck/`.
name = "common-probe-96"
site = "trillium"
time = "6:00:00"                    # per row: compilation, 2.5 M at 1600 s/M, the attempts
resources = { nodes = 1 }
mode = "sequential"
checkpoints = true
mutable_restarts = true

[restart]
to = "checkpoint"
walltime = "walltime"
margin = "0:20:00"
continue_code = 3

[[run]]
label = "s5"
threads = 192
cmd = "test/binary_runs.jl chart=harmonic interior=fitted seed=rest L=32 roots=8 radii=8,4,2,1,3/4 q=4 cfl=1/2 fit_cont=2 lmax_fit=8 mesh=follow floor_margin=1/4 finder_N=16 spin=1 adm=1 group=b7 d=8 N=24 margin=16 n_L=20 t0=0 sigma_g=5 chunk=1/4 checkpoint_every=8 t_end=60 find_interval=1/16 common_probe=28 out=out"

[[run]]
label = "s10"
threads = 192
cmd = "test/binary_runs.jl chart=harmonic interior=fitted seed=rest L=32 roots=8 radii=8,4,2,1,3/4 q=4 cfl=1/2 fit_cont=2 lmax_fit=8 mesh=follow floor_margin=1/4 finder_N=16 spin=1 adm=1 group=b7 d=8 N=24 margin=16 n_L=20 t0=0 sigma_g=10 chunk=1/4 checkpoint_every=8 t_end=60 find_interval=1/16 common_probe=28 out=out"
