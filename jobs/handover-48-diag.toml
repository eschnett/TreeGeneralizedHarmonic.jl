# Step B7's diagnosis of the remnant's failure at formation (`CODE.md`, "The
# common horizon and the handover", "When."): the `σ_g = 5` row of
# `jobs/handover-48.toml`, handed over at `h = 1/24` no earlier than
# `handover_from` — `29.25`, `29.5` and `29.75 M`, where the common horizon's
# radii are `1.74`, `1.63` and about `1.5` to one — and at `29.75 M` with the
# remnant's margin and ramp doubled (`remnant_depth=2`, the layer as deep as the
# run at `1/12` that held). Four rows to one node at 48 threads each.
#
# The spec it diagnoses:
# Step B7's handover on step H4's 1/48 roll-on rows (`common=1 handover=1`):
# continued from their 28 M checkpoints, the common horizon found, formed, and
# the pair handed over to one fitted remnant at the first row after formation
# whose common core holds both holes' cores, then the remnant to 40 M. It
# measures what the handover does to the constraints, the area and the remnant's
# layer (`CODE.md`, "The common horizon and the handover"). The rows' commands
# are `jobs/h4-pair.toml`'s, plus the two options and `t_end=40`.
#
# The start is not in this spec: copy the row's 28 M checkpoint — the older of
# the two, `binary.it0000005071.h5` for s5, and nothing newer — from
# `/scratch/eschnett/claude/xcts-s1/h4r48/s5/ck/` into every run's
# `<scratch>/<study>/handover-48-diag-<label>/mutable/ck/` before the first
# job. Copy, do not link: the run rotates the files in its `ck/`.
name = "handover-48-diag"
site = "trillium"
time = "3:00:00"                    # four rows at 48 threads, each about twice the 40 min of one at 96
resources = { nodes = 1 }
mode = "parallel"
checkpoints = true
mutable_restarts = true

[restart]
to = "checkpoint"
walltime = "walltime"
margin = "0:20:00"
continue_code = 3

[[run]]
label = "f2925"
threads = 48
cmd = "test/binary_runs.jl chart=harmonic interior=fitted seed=rest L=32 roots=8 radii=8,4,2,1,3/4 q=4 cfl=1/2 fit_cont=2 lmax_fit=8 mesh=follow floor_margin=1/4 finder_N=16 spin=1 adm=1 group=b7d d=8 N=12 margin=6 n_L=12 t0=0 sigma_g=5 chunk=1/4 checkpoint_every=8 t_end=36 find_interval=1/8 common=1 handover=1 out=out handover_from=29.25"

[[run]]
label = "f295"
threads = 48
cmd = "test/binary_runs.jl chart=harmonic interior=fitted seed=rest L=32 roots=8 radii=8,4,2,1,3/4 q=4 cfl=1/2 fit_cont=2 lmax_fit=8 mesh=follow floor_margin=1/4 finder_N=16 spin=1 adm=1 group=b7d d=8 N=12 margin=6 n_L=12 t0=0 sigma_g=5 chunk=1/4 checkpoint_every=8 t_end=36 find_interval=1/8 common=1 handover=1 out=out handover_from=29.5"

[[run]]
label = "f2975"
threads = 48
cmd = "test/binary_runs.jl chart=harmonic interior=fitted seed=rest L=32 roots=8 radii=8,4,2,1,3/4 q=4 cfl=1/2 fit_cont=2 lmax_fit=8 mesh=follow floor_margin=1/4 finder_N=16 spin=1 adm=1 group=b7d d=8 N=12 margin=6 n_L=12 t0=0 sigma_g=5 chunk=1/4 checkpoint_every=8 t_end=36 find_interval=1/8 common=1 handover=1 out=out handover_from=29.75"

[[run]]
label = "f2975d2"
threads = 48
cmd = "test/binary_runs.jl chart=harmonic interior=fitted seed=rest L=32 roots=8 radii=8,4,2,1,3/4 q=4 cfl=1/2 fit_cont=2 lmax_fit=8 mesh=follow floor_margin=1/4 finder_N=16 spin=1 adm=1 group=b7d d=8 N=12 margin=6 n_L=12 t0=0 sigma_g=5 chunk=1/4 checkpoint_every=8 t_end=36 find_interval=1/8 common=1 handover=1 out=out handover_from=29.75 remnant_depth=2"
