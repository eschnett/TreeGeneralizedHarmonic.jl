name = "TreeGeneralizedHarmonic"
uuid = "ec251ae6-5b3e-4df5-a9c7-7e3f01cdd68c"
version = "0.1.0"
authors = ["Erik Schnetter <schnetter@gmail.com>"]

[deps]
ApparentHorizonFinder = "2326d305-03d0-4260-ba27-fc7d1edfc55d"
KernelAbstractions = "63c18a36-062a-441e-b654-da1e3ab1ce7c"
KorzynskiSpin = "dddeb715-7fc8-4947-8935-98683755b697"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
OrdinaryDiffEqLowOrderRK = "1344f307-1e59-4825-a18e-ace9aa3fa4c6"
SciMLBase = "0bca4576-84f4-4d90-8ffe-ffa030f20462"
SpacetimeMetrics = "77e61b41-605e-43a6-b70f-04b7dcd1f572"
StaticArrays = "90137ffa-7385-5640-81b9-e52037218182"
TreeAMR = "91bc416d-811c-44c1-9bc4-b9c8bbdbbd08"

[compat]
ApparentHorizonFinder = "2.1"
KernelAbstractions = "0.9.42, 1"
KorzynskiSpin = "1.1"
LinearAlgebra = "1.11"
OrdinaryDiffEqLowOrderRK = "2.2.5"
SciMLBase = "3.50.1"
SpacetimeMetrics = "1.6"
StaticArrays = "1"
TreeAMR = "0.1.1"
julia = "1.11"

# **TreeAMR is a registry dependency** from v0.1.1 (2026-09-21): it is in
# General, so `[compat]` selects it and it needs no `[sources]` entry. The
# checkout at `~/src/jl/TreeAMR` is still not what the tests see — they now
# see the *released* version, so an unpushed *or unreleased* change there
# is invisible here.
#
# The other three are still located by `[sources]`, for two different
# reasons:
#
#   * `SpacetimeMetrics` and `ApparentHorizonFinder` are registered, but
#     `rev = "main"` is deliberate — both are developed alongside this
#     package. `ApparentHorizonFinder` additionally *has* to be pinned:
#     the `[compat]` bound below is `2.1` and General carries only up to
#     `2.0.0`.
#   * `KorzynskiSpin` is not registered at all. Its repository became
#     **public** on 2026-09-21, so the URL is plain `https` like the
#     others and the deploy key the workflow used is gone — an anonymous
#     clean checkout and a fork's pull request both resolve it now, which
#     is what the clean-checkout check in `CLAUDE.md` exists to prove.
#
# `[sources]` is what keeps the Julia floor at **1.11**: the section was
# introduced there. Lowering the floor needs every entry below to go, which
# needs `KorzynskiSpin` registered and `ApparentHorizonFinder` 2.1
# released. Vendoring a package or adding a local-path source would hide
# that rather than state it.
[sources]
ApparentHorizonFinder = {url = "https://github.com/eschnett/ApparentHorizonFinder.jl", rev = "main"}
KorzynskiSpin = {url = "https://github.com/eschnett/KorzynskiSpin.jl", rev = "main"}
SpacetimeMetrics = {url = "https://github.com/eschnett/SpacetimeMetrics.jl", rev = "main"}
